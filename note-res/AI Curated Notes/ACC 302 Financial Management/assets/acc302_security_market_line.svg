<svg width="600" height="350" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="100%" height="100%" fill="none" />
    
    <!-- Axes -->
    <line x1="60" y1="300" x2="560" y2="300" stroke="#888" stroke-width="2" />
    <line x1="60" y1="40" x2="60" y2="300" stroke="#888" stroke-width="2" />
    <text x="310" y="340" fill="#ccc" font-family="Arial" font-size="14" text-anchor="middle">Systematic Risk (Beta, β)</text>
    <text x="25" y="170" fill="#ccc" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90 25,170)">Required Return (R)</text>

    <!-- SML Line -->
    <line x1="60" y1="240" x2="520" y2="60" stroke="#00a3cc" stroke-width="3" />
    <text x="530" y="55" fill="#00a3cc" font-family="Arial" font-size="16" font-weight="bold">SML</text>

    <!-- Risk-Free Rate -->
    <circle cx="60" cy="240" r="5" fill="#fff" />
    <text x="20" y="245" fill="#fff" font-family="Arial" font-size="14">Rf</text>

    <!-- Market Portfolio -->
    <line x1="60" y1="150" x2="290" y2="150" stroke="#888" stroke-dasharray="5,5" />
    <line x1="290" y1="300" x2="290" y2="150" stroke="#888" stroke-dasharray="5,5" />
    <circle cx="290" cy="150" r="6" fill="#ffb347" />
    <text x="300" y="140" fill="#ffb347" font-family="Arial" font-size="14" font-weight="bold">Market (M)</text>
    <text x="290" y="320" fill="#ccc" font-family="Arial" font-size="14" text-anchor="middle">1.0</text>
    <text x="20" y="155" fill="#ffb347" font-family="Arial" font-size="14">Rm</text>

    <!-- Alpha Undervalued (Above SML) -->
    <circle cx="400" cy="80" r="6" fill="#2ecc71" />
    <text x="415" y="85" fill="#2ecc71" font-family="Arial" font-size="14" font-weight="bold">Undervalued (+α)</text>
    <line x1="400" y1="80" x2="400" y2="107" stroke="#2ecc71" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Alpha Overvalued (Below SML) -->
    <circle cx="200" cy="230" r="6" fill="#e74c3c" />
    <text x="215" y="235" fill="#e74c3c" font-family="Arial" font-size="14" font-weight="bold">Overvalued (-α)</text>
    <line x1="200" y1="230" x2="200" y2="185" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Arrow Def -->
    <defs>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      fill: var(--text-normal, #f0f0f0);
    }
    .axis, line[stroke="#888"], line[stroke="#ccc"] {
      stroke: var(--text-muted, #999999);
    }
    @media (prefers-color-scheme: light) {
      text {
        fill: #222222 !important;
      }
      .axis, line[stroke="#888"], line[stroke="#ccc"] {
        stroke: #666666 !important;
      }
    }
  </style>

      <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" />
      </marker>
    </defs>
  </svg>