<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <title>BBA 4Th Semester — Shared Obsidian Notes</title>
  <meta name="description" content="Obsidian digital garden workspace." />
  <link rel="icon" href="../../site-lib/media/favicon.png" />

  <link rel="stylesheet" href="../../site-lib/styles/theme.css" />
  <link rel="stylesheet" href="../../site-lib/styles/obsidian.css" />
  <link rel="stylesheet" href="../../site-lib/styles/workspace.css" />
  <link rel="stylesheet" href="../../site-lib/styles/diagrams.css" />
  <link rel="stylesheet" href="../../site-lib/styles/snippets.css" />
  <link rel="stylesheet" href="../../site-lib/styles/app-custom.css" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body data-vault-folder="4th Semester">
  <header class="obsidian-app-header">
    <div class="header-left">
      <button id="btn-toggle-left" class="tool-btn active" title="Toggle File Explorer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>

      <a href="../../" class="header-title-badge" title="Return to Cosmic Landing Page">
        <svg class="vault-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>Shared Vault</span>
      </a>
    </div>

    <div class="header-center">
      <button id="btn-quick-search" class="tool-btn" title="Quick Search (Ctrl + K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Search notes...</span>
        <kbd style="font-size: 0.7rem; opacity: 0.6; background: rgba(255,255,255,0.1); padding: 1px 5px; border-radius: 3px;">Ctrl K</kbd>
      </button>
    </div>

    <div class="header-right">
      <div class="header-action-group">
        <button id="btn-toggle-width" class="tool-btn" title="Toggle Readable Line Length / Full Width">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>

        <div class="segmented-control" title="Adjust Text Size">
          <button id="btn-font-minus" class="seg-btn" title="Decrease font size (A-)">A-</button>
          <button id="btn-font-plus" class="seg-btn" title="Increase font size (A+)">A+</button>
        </div>
      </div>

      <div class="header-divider" role="separator"></div>

      <div class="header-action-group">
        <button id="btn-vault-health" class="tool-btn" title="Vault Health & Syntax Diagnostics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
          </svg>
          <span id="vault-health-badge" class="tool-badge is-clean" title="Vault Health Score">100%</span>
        </button>

        <button id="btn-toggle-theme" class="tool-btn" title="Toggle Dark/Light Theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <button id="btn-toggle-right" class="tool-btn active" title="Toggle Outline & Graph Sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="15" y1="3" x2="15" y2="21"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="obsidian-workspace">
    <aside id="sidebar-left" class="obsidian-sidebar left">
      <div class="sidebar-header">
        <span class="sidebar-title">4Th Semester Notes</span>
        <button id="btn-collapse-expand-all" class="tool-btn" title="Collapse or Expand all directories" aria-label="Toggle All Folders">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 14 10 14 10 20"></polyline>
            <polyline points="20 10 14 10 14 4"></polyline>
            <line x1="14" y1="10" x2="21" y2="3"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>
      </div>
      <div id="file-tree-container" class="sidebar-scrollable"></div>
    </aside>

    <section class="obsidian-main-center">
      <div id="note-viewport" class="note-viewport-scrollable">
        <div id="note-container" class="note-container readable-line-length"></div>
      </div>
    </section>

    <aside id="sidebar-right" class="obsidian-sidebar right">
      <div class="sidebar-scrollable" id="right-sidebar-scrollable">
        <div class="graph-view-wrapper">
          <div class="feature-header">
            <div class="feature-title">Interactive Graph</div>
          </div>
          <div class="graph-view-placeholder">
            <div class="graph-view-container">
              <div class="graph-icon graph-expand" id="graph-sidebar-expand" role="button" aria-label="Expand">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="7" y1="17" x2="17" y2="7"></line>
                  <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
              </div>
              <div class="graph-icon graph-global" id="graph-sidebar-global" role="button" aria-label="Global Graph">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="18" r="3"></circle>
                  <circle cx="6" cy="6" r="3"></circle>
                  <circle cx="18" cy="6" r="3"></circle>
                  <path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"></path>
                  <path d="M12 12v3"></path>
                </svg>
              </div>
              <canvas id="graph-canvas" width="512" height="512"></canvas>
            </div>
          </div>
          <div class="graph-mode-indicator" id="graph-mode-label">Local Graph</div>
        </div>

        <div id="outline" class="tree-container">
          <div class="feature-header">
            <div class="feature-title">Table Of Contents</div>
            <div class="toc-header-actions">
              <button id="btn-toc-search-toggle" class="tool-btn-mini" title="Filter / Search Headings" aria-label="Filter Headings">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </button>
              <button id="btn-toc-collapse-expand-all" class="tool-btn-mini" title="Collapse or Expand All Subsections" aria-label="Toggle All Headings">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="4 14 10 14 10 20"></polyline>
                  <polyline points="20 10 14 10 14 4"></polyline>
                  <line x1="14" y1="10" x2="21" y2="3"></line>
                  <line x1="3" y1="21" x2="10" y2="14"></line>
                </svg>
              </button>
            </div>
          </div>
          <div id="toc-search-bar" class="toc-search-bar is-hidden">
            <input id="toc-filter-input" type="text" placeholder="Filter headings..." class="toc-filter-input" autocomplete="off" />
            <button id="btn-toc-filter-clear" class="toc-filter-clear-btn" title="Clear filter">&times;</button>
          </div>
          <div id="toc-container"></div>
        </div>

        <div id="backlinks-section" class="tree-container" style="margin-top: 16px;">
          <div class="feature-header">
            <div class="feature-title">Linked References</div>
          </div>
          <div id="backlinks-container">
            <div class="backlinks-empty">Select a note to view backlinks.</div>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <div id="search-modal" class="view-modal-overlay" onclick="if(event.target === this) window.ObsidianApp.closeSearchModal();">
    <div class="search-palette">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search-modal-input" class="search-palette-input" type="text" placeholder="Search notes..." autocomplete="off" />
      </div>
      <div id="search-modal-results" class="search-results-list"></div>
    </div>
  </div>

  <div id="graph-modal" class="view-modal-overlay" onclick="if(event.target === this) window.ObsidianApp.closeGraphModal();">
    <div class="graph-modal-content">
      <div class="graph-modal-header">
        <div style="display: flex; align-items: center; gap: 8px; font-weight: 600;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="18" cy="18" r="3"></circle>
            <circle cx="18" cy="6" r="3"></circle>
            <line x1="8.5" y1="7.5" x2="15.5" y2="16.5"></line>
            <line x1="8.5" y1="6" x2="15.5" y2="6"></line>
          </svg>
          <span id="modal-graph-title">Knowledge Graph</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="tool-btn" id="modal-toggle-local-global" style="font-size: 0.8rem; padding: 4px 10px;">
            Switch to Global Graph
          </button>
          <button class="close-modal-btn" onclick="window.ObsidianApp.closeGraphModal()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <canvas id="graph-canvas-modal" style="width: 100%; height: 100%; touch-action: none; cursor: grab;"></canvas>
    </div>
  </div>

  <!-- Vault Health Diagnostics Modal -->
  <div id="vault-health-modal" class="view-modal-overlay" onclick="if(event.target === this) window.ObsidianApp.closeHealthModal();">
    <div class="health-modal-content">
      <div class="health-modal-header">
        <div style="display: flex; align-items: center; gap: 8px; font-weight: 600;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--frost1, #88c0d0);">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
          </svg>
          <span>Vault Health & Syntax Diagnostics</span>
        </div>
        <button class="close-modal-btn" onclick="window.ObsidianApp.closeHealthModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="health-metrics-grid">
        <div class="health-metric-card">
          <span class="metric-val" id="metric-health-score">--</span>
          <span class="metric-lbl">Health Score</span>
        </div>
        <div class="health-metric-card">
          <span class="metric-val" id="metric-total-notes">--</span>
          <span class="metric-lbl">Total Notes</span>
        </div>
        <div class="health-metric-card">
          <span class="metric-val" id="metric-clean-notes" style="color: var(--green, #a3be8c);">--</span>
          <span class="metric-lbl">Clean Notes</span>
        </div>
        <div class="health-metric-card">
          <span class="metric-val" id="metric-warning-notes" style="color: var(--orange, #d08770);">--</span>
          <span class="metric-lbl">Notes with Warnings</span>
        </div>
        <div class="health-metric-card">
          <span class="metric-val" id="metric-auto-fixed" style="color: var(--frost1, #88c0d0);">--</span>
          <span class="metric-lbl">Auto-Resolved</span>
        </div>
      </div>

      <div class="health-filter-bar">
        <button class="health-filter-btn active" data-filter="all">All Issues (<span id="count-all">0</span>)</button>
        <button class="health-filter-btn" data-filter="LaTeX / Math">LaTeX / Math (<span id="count-math">0</span>)</button>
        <button class="health-filter-btn" data-filter="WikiLink">WikiLinks (<span id="count-links">0</span>)</button>
        <button class="health-filter-btn" data-filter="Media Embed">Media & Embeds (<span id="count-media">0</span>)</button>
        <button class="health-filter-btn" data-filter="Callout">Callouts (<span id="count-callout">0</span>)</button>
      </div>

      <div id="health-issues-list" class="health-issues-list">
        <div style="text-align: center; padding: 30px; color: var(--text-muted, #d8dee9);">Loading diagnostics...</div>
      </div>
    </div>
  </div>

  <div id="toast-notification" class="toast-msg"></div>

  <script src="../../site-lib/scripts/app-reader.js"></script>
</body>
</html>
