<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">Working Capital Financing Strategy</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">Matching Maturity Strategy (Self-Liquidating Approach)</text>

  <!-- Asset Layer Regions -->
  <rect x="110" y="320" width="570" height="80" fill="currentColor" fill-opacity="0.12"/>
  <rect x="110" y="230" width="570" height="90" fill="#0ea5e9" fill-opacity="0.2"/>
  <path d="M 110 230 C 150 140, 200 140, 240 230 C 280 310, 330 310, 370 230 C 410 140, 460 140, 500 230 C 540 310, 590 310, 630 230 L 680 230 L 110 230 Z" fill="#f59e0b" fill-opacity="0.25"/>

  <!-- Asset Boundaries -->
  <line x1="110" y1="320" x2="680" y2="320" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="110" y1="230" x2="680" y2="230" stroke="#0ea5e9" stroke-width="2"/>

  <!-- Total Asset Curve Line -->
  <path d="M 110 230 C 150 140, 200 140, 240 230 C 280 310, 330 310, 370 230 C 410 140, 460 140, 500 230 C 540 310, 590 310, 630 230 L 680 230" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <!-- Financing Divide Line -->
  <line x1="110" y1="230" x2="680" y2="230" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6 6"/>

  <!-- Axes -->
  <line x1="110" y1="410" x2="110" y2="90" stroke="currentColor" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="110" y1="410" x2="720" y2="410" stroke="currentColor" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Axis Labels -->
  <text x="50" y="250" font-size="14" font-weight="600" fill="currentColor" transform="rotate(-90 50 250)" text-anchor="middle">Amount ($)</text>
  <text x="415" y="445" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Time (Periods)</text>

  <!-- Section Labels -->
  <text x="395" y="365" font-size="13" font-weight="700" fill="currentColor" text-anchor="middle">Fixed Assets (Long-Term Capital)</text>
  <text x="420" y="280" font-size="13" font-weight="700" fill="#0ea5e9" text-anchor="middle">Permanent Current Assets</text>
  <text x="300" y="190" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">Fluctuating Current Assets</text>

  <!-- Brackets / Legend Sidebar -->
  <g transform="translate(690, 140)">
    <path d="M 0 0 L 10 0 L 10 45 L 20 45 L 10 45 L 10 90 L 0 90" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="28" y="50" font-size="11" font-weight="700" fill="#f59e0b" transform="rotate(90 28 50)" text-anchor="middle">Short-Term Debt</text>
  </g>

  <g transform="translate(690, 235)">
    <path d="M 0 0 L 10 0 L 10 82.5 L 20 82.5 L 10 82.5 L 10 165 L 0 165" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <text x="28" y="82.5" font-size="11" font-weight="700" fill="#0ea5e9" transform="rotate(90 28 82.5)" text-anchor="middle">Long-Term Debt + Equity</text>
  </g>
</svg>
