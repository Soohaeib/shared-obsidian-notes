<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      fill: var(--text-normal, #f0f0f0);
    }
    .axis, line[stroke="#888"], line[stroke="#ccc"] {
      stroke: var(--text-muted, #999999);
    }
    @media (prefers-color-scheme: light) {
      text {
        fill: #222222 !important;
      }
      .axis, line[stroke="#888"], line[stroke="#ccc"] {
        stroke: #666666 !important;
      }
    }
  </style>

    <!-- Background -->
    <rect width="100%" height="100%" fill="none" />
    
    <!-- Axes -->
    <line x1="50" y1="280" x2="550" y2="280" stroke="#888" stroke-width="2" />
    <line x1="50" y1="20" x2="50" y2="280" stroke="#888" stroke-width="2" />
    <text x="300" y="295" fill="#ccc" font-family="Arial" font-size="14" text-anchor="middle">Time</text>
    <text x="20" y="150" fill="#ccc" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90 20,150)">Dollar Amount ($)</text>

    <!-- Fixed Assets -->
    <rect x="52" y="200" width="498" height="78" fill="#1e3a5f" opacity="0.6" />
    <text x="300" y="245" fill="#fff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Fixed Assets</text>

    <!-- Permanent Current Assets -->
    <rect x="52" y="140" width="498" height="60" fill="#00a3cc" opacity="0.6" />
    <text x="300" y="175" fill="#fff" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Permanent Current Assets</text>

    <!-- Temporary Current Assets (Fluctuating Curve) -->
    <path d="M 50 140 Q 100 40 150 140 T 250 140 T 350 140 T 450 140 T 550 140" fill="#ffb347" opacity="0.5" />
    <path d="M 50 140 Q 100 40 150 140 T 250 140 T 350 140 T 450 140 T 550 140" fill="none" stroke="#ff8c1a" stroke-width="3" />
    <text x="100" y="70" fill="#fff" font-family="Arial" font-size="12" font-weight="bold">Temporary</text>
    <text x="100" y="85" fill="#fff" font-family="Arial" font-size="12" font-weight="bold">Current Assets</text>
  </svg>