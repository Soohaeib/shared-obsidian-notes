<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">Economic Order Quantity (EOQ) Model</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="currentColor" opacity="0.75">Inventory Trade-off between Holding Costs and Ordering Costs</text>

  <!-- Axes -->
  <line x1="120" y1="410" x2="120" y2="80" stroke="currentColor" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="120" y1="410" x2="720" y2="410" stroke="currentColor" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Axis Labels -->
  <text x="60" y="245" font-size="14" font-weight="600" fill="currentColor" transform="rotate(-90 60 245)" text-anchor="middle">Annual Cost ($)</text>
  <text x="420" y="448" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">Order Quantity (Q)</text>

  <!-- Dotted Line for EOQ -->
  <line x1="390" y1="410" x2="390" y2="200" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Carrying/Holding Cost Line -->
  <line x1="130" y1="390" x2="670" y2="130" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Ordering Cost Curve -->
  <path d="M 140 120 Q 220 340 670 380" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>

  <!-- Total Cost Curve -->
  <path d="M 160 130 Q 390 320 660 130" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Intersect & Minimum Points -->
  <circle cx="390" cy="266" r="6" fill="#0ea5e9" stroke="currentColor" stroke-width="2"/>
  <circle cx="390" cy="225" r="6" fill="#10b981" stroke="currentColor" stroke-width="2"/>

  <!-- Labels -->
  <text x="650" y="125" font-size="13" font-weight="700" fill="#f43f5e">Total Inventory Cost (TC)</text>
  <text x="600" y="180" font-size="13" font-weight="700" fill="#f59e0b">Carrying / Holding Cost (H × Q/2)</text>
  <text x="600" y="365" font-size="13" font-weight="700" fill="#0ea5e9">Ordering / Setup Cost (S × D/Q)</text>

  <!-- EOQ Tag -->
  <g transform="translate(325, 400)">
    <rect x="0" y="0" width="130" height="26" rx="4" fill="#10b981"/>
    <text x="65" y="17" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">EOQ Point (Q*)</text>
  </g>

  <g transform="translate(395, 215)">
    <rect x="0" y="0" width="125" height="24" rx="4" fill="currentColor" fill-opacity="0.1" stroke="#10b981" stroke-width="1"/>
    <text x="62" y="16" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">Min Total Cost</text>
  </g>
</svg>
