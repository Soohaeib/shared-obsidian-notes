<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="grey"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="grey">Capital Budgeting: MCC &amp; IOS Schedule</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="grey" opacity="0.75">Intersection of Marginal Cost of Capital and Investment Opportunity Schedule</text>

  <!-- Axes -->
  <line x1="120" y1="410" x2="120" y2="80" stroke="grey" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="120" y1="410" x2="720" y2="410" stroke="grey" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Axis Labels -->
  <text x="50" y="245" font-size="14" font-weight="600" fill="grey" transform="rotate(-90 50 245)" text-anchor="middle">Rate of Return / Cost of Capital (%)</text>
  <text x="420" y="448" font-size="14" font-weight="600" fill="grey" text-anchor="middle">New Capital Raised / Invested ($)</text>

  <!-- Dotted Line -->
  <line x1="430" y1="410" x2="430" y2="180" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- IOS Step Down (Green) -->
  <path d="M 120 110 L 250 110 L 250 180 L 430 180 L 430 270 L 580 270 L 580 370 L 690 370" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="square"/>

  <!-- MCC Step Up (Red/Rose) -->
  <path d="M 120 270 L 320 270 L 320 230 L 430 230 L 430 180 L 560 180 L 560 120 L 690 120" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="square"/>

  <!-- Intersection Point -->
  <circle cx="430" cy="180" r="7" fill="#f59e0b" stroke="currentColor" stroke-width="2"/>

  <!-- Project Labels -->
  <text x="185" y="100" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">Project A (IRR = 15%)</text>
  <text x="340" y="170" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">Project B (IRR = 13%)</text>
  <text x="505" y="260" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">Project C (IRR = 10%)</text>

  <!-- Callouts -->
  <g transform="translate(130, 245)">
    <rect x="0" y="0" width="130" height="22" rx="4" fill="grey" fill-opacity="0.1" stroke="#f43f5e" stroke-width="1"/>
    <text x="65" y="15" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle">MCC Schedule</text>
  </g>

  <g transform="translate(560, 380)">
    <rect x="0" y="0" width="120" height="22" rx="4" fill="grey" fill-opacity="0.1" stroke="#10b981" stroke-width="1"/>
    <text x="60" y="15" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">IOS Schedule</text>
  </g>

  <g transform="translate(360, 400)">
    <rect x="0" y="0" width="140" height="24" rx="4" fill="#f59e0b"/>
    <text x="70" y="16" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Optimal Capital Budget</text>
  </g>
</svg>
