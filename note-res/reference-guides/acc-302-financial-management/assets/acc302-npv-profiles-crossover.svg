<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="grey"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="grey">NPV Profiles &amp; Crossover Rate</text>
  <text x="400" y="58" text-anchor="middle" font-size="13" fill="grey" opacity="0.75">Comparing Mutually Exclusive Projects across Discount Rates</text>

  <!-- Axes -->
  <line x1="120" y1="360" x2="120" y2="90" stroke="grey" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="120" y1="360" x2="720" y2="360" stroke="grey" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- Axis Labels -->
  <text x="60" y="225" font-size="14" font-weight="600" fill="grey" transform="rotate(-90 60 225)" text-anchor="middle">Net Present Value (NPV $)</text>
  <text x="420" y="398" font-size="14" font-weight="600" fill="grey" text-anchor="middle">Discount Rate / Cost of Capital (%)</text>

  <!-- Ranking Conflict Zones -->
  <rect x="120" y="100" width="280" height="260" fill="#f59e0b" fill-opacity="0.12"/>
  <text x="260" y="125" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">Ranking Conflict Zone</text>

  <rect x="400" y="100" width="300" height="260" fill="#10b981" fill-opacity="0.12"/>
  <text x="550" y="125" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">No Ranking Conflict Zone</text>

  <!-- Crossover Line -->
  <line x1="400" y1="360" x2="400" y2="215" stroke="#10b981" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Project Lines -->
  <path d="M 140 120 L 560 380" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 140 210 L 670 380" fill="none" stroke="#0ea5e9" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Crossover Point -->
  <circle cx="400" cy="281" r="7" fill="#10b981" stroke="currentColor" stroke-width="2"/>

  <!-- IRR Points -->
  <circle cx="527" cy="360" r="5" fill="#f43f5e"/>
  <circle cx="612" cy="360" r="5" fill="#0ea5e9"/>

  <!-- Labels -->
  <text x="145" y="112" font-size="13" font-weight="700" fill="#f43f5e">Project A</text>
  <text x="145" y="202" font-size="13" font-weight="700" fill="#0ea5e9">Project B</text>

  <text x="527" y="380" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle">IRR A</text>
  <text x="612" y="380" font-size="11" font-weight="700" fill="#0ea5e9" text-anchor="middle">IRR B</text>

  <g transform="translate(325, 350)">
    <rect x="0" y="0" width="150" height="24" rx="4" fill="#10b981"/>
    <text x="75" y="16" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Crossover Rate (r_cross)</text>
  </g>
</svg>
