<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      fill: var(--text-normal, #f0f0f0);
    }
    .axis, line[stroke="#888"], line[stroke="#ccc"] {
      stroke: var(--text-muted, #999999);
    }
    @media (prefers-color-scheme: light) {
      text {
        fill: #222222 !important;
      }
      .axis, line[stroke="#888"], line[stroke="#ccc"] {
        stroke: #666666 !important;
      }
    }
  </style>

    <!-- Background -->
    <rect width="100%" height="100%" fill="none" />

    <!-- Grid and Axes -->
    <line x1="50" y1="250" x2="550" y2="250" stroke="#888" stroke-width="2" />
    <line x1="50" y1="50" x2="50" y2="250" stroke="#888" stroke-width="2" />
    <text x="300" y="285" fill="#ccc" font-family="Arial" font-size="14" text-anchor="middle">Time to Maturity (Approaching Zero)</text>
    <text x="20" y="150" fill="#ccc" font-family="Arial" font-size="14" text-anchor="middle" transform="rotate(-90 20,150)">Bond Price ($)</text>

    <!-- Par Value Line -->
    <line x1="50" y1="150" x2="550" y2="150" stroke="#00a3cc" stroke-width="2" stroke-dasharray="6,4" />
    <text x="560" y="155" fill="#00a3cc" font-family="Arial" font-size="14" font-weight="bold">$1,000 Par Value</text>

    <!-- Premium Bond Curve -->
    <path d="M 50 70 Q 300 90 550 150" fill="none" stroke="#ffb347" stroke-width="3" />
    <text x="80" y="60" fill="#ffb347" font-family="Arial" font-size="14" font-weight="bold">Premium Bond</text>

    <!-- Discount Bond Curve -->
    <path d="M 50 230 Q 300 210 550 150" fill="none" stroke="#ff4d4d" stroke-width="3" />
    <text x="80" y="245" fill="#ff4d4d" font-family="Arial" font-size="14" font-weight="bold">Discount Bond</text>
  </svg>