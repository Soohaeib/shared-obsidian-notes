<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <title>BBA 5th Semester — Shared Obsidian Notes</title>
  <meta name="description" content="Obsidian digital garden workspace for BBA 5th Semester notes." />
  <link rel="icon" href="../site-lib/media/favicon.png" />

  <!-- Native Obsidian & Nord Theme Stylesheets -->
  <link rel="stylesheet" href="../site-lib/styles/theme.css" />
  <link rel="stylesheet" href="../site-lib/styles/obsidian.css" />
  <link rel="stylesheet" href="../site-lib/styles/app-custom.css" />

  <!-- KaTeX for Mathematics Formula Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Mermaid.js for Diagramming Support -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

  <!-- Marked for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body data-vault-folder="5th-semester">

  <!-- Top App Header / Action Bar -->
  <header class="obsidian-app-header">
    <div class="header-left">
      <!-- Left Sidebar Toggle Button -->
      <button id="btn-toggle-left" class="tool-btn active" title="Toggle File Explorer (Left Sidebar)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>

      <!-- Return to Main Cosmic Landing Page -->
      <a href="../" class="header-title-badge" title="Return to Cosmic Landing Page">
        <svg class="vault-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>Shared Vault</span>
      </a>

      <!-- Breadcrumbs -->
      <div id="breadcrumb-container" class="breadcrumb-nav">
        <a href="../" class="breadcrumb-crumb" title="Main Vault Landing Page">Vault</a>
        <span class="sep">/</span>
        <a href="#" class="breadcrumb-crumb" title="5th Semester Home">5th Semester</a>
        <span class="sep">/</span>
        <span class="current-crumb">Overview</span>
      </div>
    </div>

    <div class="header-center">
      <!-- Quick Search Trigger -->
      <button id="btn-quick-search" class="tool-btn" title="Quick Search notes (Ctrl + K)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Search 5th semester notes...</span>
        <kbd style="font-size: 0.7rem; opacity: 0.6; background: rgba(255,255,255,0.1); padding: 1px 5px; border-radius: 3px;">Ctrl K</kbd>
      </button>
    </div>

    <div class="header-right">
      <!-- Graph Canvas Modal Trigger -->
      <button id="btn-open-graph" class="tool-btn" title="Open Fullscreen Interactive Graph View">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="6" cy="6" r="3"></circle>
          <circle cx="18" cy="18" r="3"></circle>
          <circle cx="18" cy="6" r="3"></circle>
          <line x1="8.5" y1="7.5" x2="15.5" y2="16.5"></line>
          <line x1="8.5" y1="6" x2="15.5" y2="6"></line>
        </svg>
        <span>Graph View</span>
      </button>

      <!-- Layout Width Mode Toggle -->
      <button id="btn-toggle-width" class="tool-btn" title="Toggle Responsive Width (Full Width vs Centered Column)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <line x1="21" y1="3" x2="14" y2="10"></line>
          <line x1="3" y1="21" x2="10" y2="14"></line>
        </svg>
        <span>Full Width</span>
      </button>

      <!-- Text Alignment (Left vs Justified) -->
      <button id="btn-toggle-align" class="tool-btn" title="Toggle Text Alignment (Left / Justify)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <span>Justify</span>
      </button>

      <!-- Font Zoom Controls -->
      <button id="btn-font-minus" class="tool-btn" title="Decrease Font Size" style="padding: 6px 8px;">A-</button>
      <button id="btn-font-plus" class="tool-btn" title="Increase Font Size" style="padding: 6px 8px;">A+</button>

      <!-- Theme Switcher -->
      <button id="btn-toggle-theme" class="tool-btn" title="Toggle Dark/Light Mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>

      <!-- Right Sidebar Toggle Button -->
      <button id="btn-toggle-right" class="tool-btn active" title="Toggle Right Sidebar (Interactive Graph & Outline)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <main class="obsidian-workspace">

    <!-- LEFT SIDEBAR: File Explorer -->
    <aside id="sidebar-left" class="obsidian-sidebar left">
      <div class="sidebar-header">
        <span class="sidebar-title">5th Semester Notes</span>
        <a href="../" class="tool-btn" style="padding: 2px 8px; font-size: 0.75rem;" title="Back to All Vaults">
          All Vaults
        </a>
      </div>

      <div id="file-tree-container" class="sidebar-scrollable">
        <!-- Dynamically populated Markdown file tree -->
      </div>
    </aside>

    <!-- CENTER MAIN: Note Viewport -->
    <section class="obsidian-main-center">
      <div id="note-viewport" class="note-viewport-scrollable">
        <div id="note-container" class="note-container readable-line-length text-align-left">
          <!-- Dynamically loaded Markdown note -->
        </div>
      </div>
    </section>

    <!-- RIGHT SIDEBAR: In-Sidebar Interactive Graph & Table of Contents -->
    <aside id="sidebar-right" class="obsidian-sidebar right">
      <div class="sidebar-scrollable" id="right-sidebar-scrollable">

        <!-- Embedded Interactive Graph View -->
        <div class="graph-view-wrapper">
          <div class="feature-header">
            <div class="feature-title">Interactive Graph</div>
          </div>
          <div class="graph-view-placeholder">
            <div class="graph-view-container">
              <div class="graph-icon graph-expand" id="graph-sidebar-expand" role="button" aria-label="Expand" title="Expand Graph View">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon">
                  <line x1="7" y1="17" x2="17" y2="7"></line>
                  <polyline points="7 7 17 7 17 17"></polyline>
                </svg>
              </div>
              <div class="graph-icon graph-global" id="graph-sidebar-global" role="button" aria-label="Global Graph" title="Toggle Global / Local Graph">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="svg-icon lucide-git-fork">
                  <circle cx="12" cy="18" r="3"></circle>
                  <circle cx="6" cy="6" r="3"></circle>
                  <circle cx="18" cy="6" r="3"></circle>
                  <path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"></path>
                  <path d="M12 12v3"></path>
                </svg>
              </div>
              <canvas id="graph-canvas" width="512" height="512"></canvas>
            </div>
          </div>
          <div class="graph-mode-indicator" id="graph-mode-label">Local Graph</div>
        </div>

        <!-- Document Outline / Table of Contents -->
        <div id="outline" class="tree-container">
          <div class="feature-header">
            <div class="feature-title">Table Of Contents</div>
          </div>
          <div id="toc-container">
            <div style="padding: 8px 4px; font-size: 0.8rem; color: var(--text-faint);">
              Open a note to view its outline.
            </div>
          </div>
        </div>

        <!-- Backlinks / Linked References Section -->
        <div id="backlinks-section" class="tree-container" style="margin-top: 16px;">
          <div class="feature-header">
            <div class="feature-title">Linked References</div>
          </div>
          <div id="backlinks-container">
            <div class="backlinks-empty">Select a note to view backlinks.</div>
          </div>
        </div>

      </div>
    </aside>

  </main>

  <!-- Quick Search Palette Modal -->
  <div id="search-modal" class="view-modal-overlay" onclick="if(event.target === this) window.ObsidianApp.closeSearchModal();">
    <div class="search-palette">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search-modal-input" class="search-palette-input" type="text" placeholder="Type to search all 5th semester notes..." autocomplete="off" />
      </div>
      <div id="search-modal-results" class="search-results-list">
        <!-- Dynamically populated results -->
      </div>
    </div>
  </div>

  <!-- Fullscreen Interactive Graph Modal -->
  <div id="graph-modal" class="view-modal-overlay" onclick="if(event.target === this) window.ObsidianApp.closeGraphModal();">
    <div class="graph-modal-content">
      <div class="graph-modal-header">
        <div style="display: flex; align-items: center; gap: 8px; font-weight: 600;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="18" cy="18" r="3"></circle>
            <circle cx="18" cy="6" r="3"></circle>
            <line x1="8.5" y1="7.5" x2="15.5" y2="16.5"></line>
            <line x1="8.5" y1="6" x2="15.5" y2="6"></line>
          </svg>
          <span id="modal-graph-title">5th Semester Knowledge Graph</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <button class="tool-btn" id="modal-toggle-local-global" style="font-size: 0.8rem; padding: 4px 10px;">
            Switch to Global Graph
          </button>
          <button class="close-modal-btn" onclick="window.ObsidianApp.closeGraphModal()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <canvas id="graph-canvas-modal" style="width: 100%; height: 100%; touch-action: none; cursor: grab;"></canvas>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-notification" class="toast-msg"></div>

  <!-- Application Script -->
  <script src="../site-lib/scripts/app-reader.js"></script>
</body>
</html>
